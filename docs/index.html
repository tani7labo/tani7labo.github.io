<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tani7labo</title>
    <meta name="description" content="tani7laboの公式サイトです。スマートフォン向けアプリなどを開発しています。">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-blob"></div>
    <div class="background-blob-2"></div>

    <header>
        <div class="container">
            <div class="logo-container">
                <h1 id="site-title">tani7labo</h1>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="policy-card">
            <div class="policy-header">
                <h2>About Us</h2>
            </div>

            <div class="policy-content">
                <p>
                    tani7laboでは、日々の生活を少し便利にするスマートフォン向けアプリケーションなどの開発を行っています。
                </p>

                <h3>Apps</h3>
                <div class="app-grid">
                    <div class="app-card">
                        <div class="app-card-header">
                            <div class="app-card-icon" style="background: linear-gradient(135deg, #3F5B2C, #5E7E44);">🌳</div>
                            <div>
                                <div class="app-card-name">集中の木</div>
                                <div class="app-card-platform">Android</div>
                            </div>
                        </div>
                        <p class="app-card-desc">集中するたびに木が育つフォーカスタイマー。タイマーをスタートするだけで、画面の中で木が少しずつ成長していきます。</p>
                        <a class="app-store-btn" href="https://play.google.com/store/apps/details?id=com.tani7labo.ontree" target="_blank" rel="noopener">
                            Google Play で見る →
                        </a>
                    </div>
                    <div class="app-card">
                        <div class="app-card-header">
                            <div class="app-card-icon" style="background: linear-gradient(135deg, #4f46e5, #7c3aed);">📈</div>
                            <div>
                                <div class="app-card-name">Rise</div>
                                <div class="app-card-platform">Android</div>
                            </div>
                        </div>
                        <p class="app-card-desc">シンプルで使いやすい習慣管理アプリ。毎日の積み重ねを記録して、成長を可視化します。</p>
                        <a class="app-store-btn" href="https://play.google.com/store/apps/details?id=com.tani7labo.rise" target="_blank" rel="noopener">
                            Google Play で見る →
                        </a>
                    </div>
                </div>

                <h3>Links</h3>
                <div class="link-card">
                    <a href="privacy.html">プライバシーポリシー</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 tani7labo</p>
        </div>
    </footer>
</body>

</html>
